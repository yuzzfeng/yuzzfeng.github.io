<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Verspätungen im Bahnnetz</title>
<desc id="desc">Schematisches Beispiel: Die Verspätung nimmt entlang dreier Bahnhöfe von fünf auf zwölf Minuten zu. Keine Messdaten.</desc>
<rect width="640" height="400" rx="16" fill="#f6f8fa"/>
<g font-family="Arial, sans-serif" fill="#243746"><text x="36" y="54" font-size="26" font-weight="bold">Verspätungen im Bahnnetz</text><text x="36" y="84" font-size="16">Zeitliche Entwicklung · räumliche Zusammenhänge</text></g>
<path d="M70 275 L300 205 L560 145" stroke="#b9c6d0" stroke-width="12" fill="none"/>
<path d="M300 205 L470 310" stroke="#dce3e8" stroke-width="8" fill="none"/>
<path d="M160 248 l20 -15 -6 22 M410 180 l20 -14 -7 21" fill="#526d82"/>
<g stroke="white" stroke-width="5"><circle cx="70" cy="275" r="18" fill="#dbae28"/><circle cx="300" cy="205" r="22" fill="#e98235"/><circle cx="560" cy="145" r="27" fill="#c84444"/></g>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#243746" font-size="19"><text x="78" y="235">+5 min</text><text x="300" y="160">+9 min</text><text x="552" y="102">+12 min</text><text x="78" y="320">Bahnhof A</text><text x="300" y="253">Bahnhof B</text><text x="552" y="198">Bahnhof C</text></g>
<text x="36" y="373" font-family="Arial, sans-serif" fill="#657789" font-size="15">Schematische Darstellung · keine Messdaten</text>
